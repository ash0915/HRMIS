<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人才检索 - 智能查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .nav-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-left h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 4px;
        }

        .nav-tab {
            padding: 6px 16px;
            background: transparent;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav-tab.active {
            background: #fff;
            color: #1e3a5f;
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 13px;
        }

        /* 主体内容区 */
        .main-container {
            display: flex;
            height: calc(100vh - 56px);
        }

        /* 侧边栏切换按钮 */
        .sidebar-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 60px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-left: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            z-index: 100;
            transition: left 0.3s ease;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        .sidebar-toggle:hover {
            background: #f5f7fa;
            color: #2c5c97;
        }

        .sidebar-toggle.collapsed {
            left: 0;
        }

        /* 左侧标签筛选面板 */
        .left-panel {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .left-panel.collapsed {
            transform: translateX(-100%);
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .panel-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 8px 36px 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .search-container input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: #2c5c97;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            background: #1a3d6e;
        }

        /* 标签分类 */
        .tag-categories {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .tag-category {
            margin-bottom: 20px;
        }

        .category-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f5f7fa;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .category-title:hover {
            background: #e8eaed;
        }

        .category-title span {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .category-toggle {
            font-size: 12px;
            color: #999;
            transition: transform 0.2s;
        }

        .category-toggle.expanded {
            transform: rotate(180deg);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: #f5f7fa;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-item:hover {
            background: #e6f0ff;
            border-color: #2c5c97;
            color: #2c5c97;
        }

        .tag-item.selected {
            background: #2c5c97;
            border-color: #2c5c97;
            color: #fff;
        }

        .tag-item input {
            display: none;
        }

        .tag-checkbox {
            width: 14px;
            height: 14px;
            border: 1px solid #999;
            border-radius: 3px;
            position: relative;
            flex-shrink: 0;
        }

        .tag-item.selected .tag-checkbox {
            background: #2c5c97;
            border-color: #2c5c97;
        }

        .tag-item.selected .tag-checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #fff;
        }

        /* 搜索按钮 */
        .search-action {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2c5c97 0%, #1a3d6e 100%);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #666;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #1e874b 100%);
            color: #fff;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        /* 右侧内容区 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 0;
            transition: width 0.3s ease;
        }

        /* 搜索头部 */
        .search-header {
            background: #fff;
            padding: 20px;
            border-bottom: none;
        }

        .landing-hero {
            text-align: center;
            padding: 28px 0 10px;
        }

        .landing-title {
            font-size: 34px;
            font-weight: 800;
            color: #1e3a5f;
            letter-spacing: 1px;
        }

        .landing-desc {
            margin-top: 10px;
            font-size: 14px;
            color: #667085;
        }

        .ai-search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .ai-search-box {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 18px;
            background: #fff;
            transition: border-color 0.2s;
        }

        .ai-search-box:focus-within {
            border-color: #2c5c97;
        }

        .selected-tag-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #e6f0ff;
            color: #2c5c97;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1;
            user-select: none;
        }

        .tag-chip-remove {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            background: rgba(44, 92, 151, 0.15);
            color: #2c5c97;
            font-size: 14px;
            line-height: 18px;
            padding: 0;
        }

        .ai-search-box input {
            flex: 1;
            min-width: 260px;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 6px 0;
            background: transparent;
        }

        .ai-search-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .ai-filter-btn {
            padding: 8px 14px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 20px;
            font-size: 13px;
            color: #2c5c97;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ai-filter-btn:hover {
            background: #f5f7fa;
        }

        .ai-search-btn {
            padding: 8px 18px;
            background: linear-gradient(135deg, #2c5c97 0%, #1a3d6e 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ai-search-btn:hover {
            opacity: 0.9;
        }

        .ai-hint {
            text-align: center;
            font-size: 12px;
            color: #98a2b3;
            margin-top: 10px;
        }

        .results-view {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
        }

        .filter-drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1200;
        }

        .filter-drawer-overlay.show {
            display: flex;
            justify-content: flex-end;
        }

        .filter-drawer {
            width: 380px;
            max-width: 92vw;
            height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
        }

        .filter-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .filter-drawer-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e3a5f;
        }

        .filter-drawer-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #f5f7fa;
            color: #667085;
            font-size: 20px;
            line-height: 32px;
            padding: 0;
        }

        .filter-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .filter-drawer-footer {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }


        /* 工具栏 */
        .toolbar {
            background: #fff;
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .result-count {
            font-size: 13px;
            color: #666;
        }

        .selected-count {
            font-size: 13px;
            color: #2c5c97;
            font-weight: 500;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .toolbar-actions .btn {
            flex: none;
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-compare {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: #fff;
        }

        .btn-compare:hover {
            opacity: 0.9;
        }

        .btn-compare:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 人员列表 */
        .person-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .table-scroll-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .table-scroll-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .person-table {
            width: 100%;
            min-width: 1200px;
            background: #fff;
            border-radius: 8px;
            border-collapse: separate;
            border-spacing: 0;
        }

        .person-table th,
        .person-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .person-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .person-table tbody tr:hover {
            background: #fafafa;
        }

        .person-table tbody tr.selected {
            background: #e8f0fe;
        }

        .person-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .tag-badge {
            display: inline-flex;
            flex-wrap: nowrap;
            gap: 4px;
            overflow-x: auto;
            padding: 2px 0;
            max-width: 150px;
        }

        .tag-badge::-webkit-scrollbar {
            height: 4px;
        }

        .tag-badge::-webkit-scrollbar-track {
            background: transparent;
        }

        .tag-badge::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 2px;
        }

        .tag-badge span {
            flex-shrink: 0;
            padding: 2px 8px;
            background: #e6f0ff;
            color: #2c5c97;
            border-radius: 8px;
            font-size: 11px;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .action-btn.resume {
            background: #e8f5e9;
            color: #27ae60;
        }

        .action-btn.resume:hover {
            background: #dcedc8;
        }

        .action-btn.profile {
            background: #e6f0ff;
            color: #2c5c97;
        }

        .action-btn.profile:hover {
            background: #cce0ff;
        }

        .action-btn.archive {
            background: #fff3e0;
            color: #f39c12;
        }

        .action-btn.archive:hover {
            background: #ffe0b2;
        }

        .action-btn:disabled {
            background: #f5f5f5;
            color: #ccc;
            cursor: not-allowed;
        }

        /* 分页 */
        .pagination {
            padding: 16px 20px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .pagination button {
            min-width: 80px;
            height: 36px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #2c5c97;
            color: #2c5c97;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f5f5;
        }

        .pagination .page-info {
            font-size: 14px;
            color: #666;
        }

        .pagination .page-jump {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pagination .page-jump input {
            width: 60px;
            height: 36px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 14px;
            text-align: center;
        }

        .pagination .page-jump input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .pagination .jump-btn {
            min-width: 60px;
            background: #2c5c97;
            color: #fff;
            border-color: #2c5c97;
        }

        .pagination .jump-btn:hover {
            background: #1a3d6e;
            border-color: #1a3d6e;
            color: #fff;
        }

        /* 人才对比弹窗 */
        .compare-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .compare-modal-overlay.show {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .compare-modal {
            background: #fff;
            border-radius: 8px;
            width: 95%;
            max-width: 1400px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .compare-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .compare-modal-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            font-size: 24px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .compare-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .compare-cards {
            display: flex;
            gap: 16px;
            overflow: auto;
            padding-bottom: 16px;
        }

        .compare-card {
            flex: 0 0 560px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .compare-card-top {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .compare-card-bottom {
            padding: 14px 16px 16px;
            overflow: auto;
            max-height: 260px;
        }

        .card-left {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-cloud {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 14px;
        }

        .card-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: 600;
            overflow: hidden;
            position: absolute;
            top: 25px;
            left: 25px;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .tag-cloud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .tag-cloud span {
            position: absolute;
            padding: 4px 10px;
            background: rgba(230, 240, 255, 0.95);
            color: #2c5c97;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .card-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        .card-position {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            text-align: center;
        }

        .card-right {
            flex: 1;
            min-width: 0;
        }

        .card-basic {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .basic-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px dashed #f0f0f0;
        }

        .basic-item:last-child {
            border-bottom: none;
        }

        .basic-label {
            font-size: 12px;
            color: #98a2b3;
            flex-shrink: 0;
        }

        .basic-value {
            font-size: 12px;
            color: #333;
            font-weight: 500;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .compare-dimensions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 360px;
        }

        .dimension-chip {
            padding: 10px 12px;
            background: #f5f7fa;
            border: 1px solid #e6e6e6;
            border-radius: 10px;
            font-size: 12px;

                if (category.tags.length === 0) return;
                const currentIndex = renderedIndex;
                renderedIndex += 1;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'tag-category';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `
                    <span>${category.name}</span>
                    <span class="category-toggle expanded">▼</span>
                `;
                titleDiv.onclick = () => toggleCategory(currentIndex);
                categoryDiv.appendChild(titleDiv);
                
                const tagList = document.createElement('div');
                tagList.className = 'tag-list';
                tagList.style.display = 'flex';
                category.tags.forEach(tag => {
                    const tagItem = document.createElement('label');
                    tagItem.className = 'tag-item';
                    tagItem.dataset.tag = tag;
                    if (selectedTags.includes(tag)) {
                        tagItem.classList.add('selected');
                    }
                    tagItem.innerHTML = `
                        <span class="tag-checkbox"></span>
                        <span>${getTagDisplayText(tag)}</span>
                    `;
                    tagItem.onclick = (e) => {
                        e.stopPropagation();
                        toggleTag(tag, tagItem);
                    };
                    tagList.appendChild(tagItem);
                });
                categoryDiv.appendChild(tagList);
                
                container.appendChild(categoryDiv);
            });

            const tagList = category.querySelector('.tag-list');
            
            if (tagList.style.display === 'none') {
                tagList.style.display = 'flex';
                toggle.classList.add('expanded');
            } else {
                tagList.style.display = 'none';
                toggle.classList.remove('expanded');
            }

            if (selectedTags.includes(tag)) {
                selectedTags = selectedTags.filter(t => t !== tag);

            } else {
                selectedTags.push(tag);
                element.classList.add('selected');

        }

        const compareDimensions = [
            '职称',
            '证书',
            '学历',
            '履历（行内）',
            '履历（行外）',
            '培训资质',
            '考核结果',
            '绩效',
            '政治面貌'
        ];

        let selectedCompareDims = new Set();

        function initCompareDimPanel() {
            const grid = document.getElementById('compareDimGrid');
            grid.innerHTML = '';
            compareDimensions.forEach(dim => {
                const label = document.createElement('label');
                label.className = 'dim-option';
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.value = dim;
                input.checked = selectedCompareDims.size === 0 ? (dim === '学历' || dim === '政治面貌') : selectedCompareDims.has(dim);
                input.onchange = () => {
                    if (input.checked) {
                        selectedCompareDims.add(dim);
                    } else {
                        selectedCompareDims.delete(dim);
                    }
                };
                const span = document.createElement('span');
                span.textContent = dim;
                label.appendChild(input);
                label.appendChild(span);
                grid.appendChild(label);
            });

            if (selectedCompareDims.size === 0) {
                selectedCompareDims.add('学历');
                selectedCompareDims.add('政治面貌');
            }
        }

        function resetCompareDims() {
            selectedCompareDims = new Set(['学历', '政治面貌']);
            initCompareDimPanel();
        }

        function showDimSelect() {
            document.getElementById('compareDimSelect').style.display = 'block';
            document.getElementById('compareCards').style.display = 'none';
            document.getElementById('compareSummary').style.display = 'none';
        }

        function showCompareResults() {
            document.getElementById('compareDimSelect').style.display = 'none';
            document.getElementById('compareCards').style.display = 'flex';
            document.getElementById('compareSummary').style.display = 'flex';

            const chips = document.getElementById('compareDimChips');
            chips.innerHTML = '';
            Array.from(selectedCompareDims).forEach(dim => {
                const chip = document.createElement('span');
                chip.className = 'dimension-chip';
                chip.textContent = dim;
                chips.appendChild(chip);
            });
        }

        function backToDimSelect() {
            showDimSelect();
        }

        function confirmCompareDims() {
            showCompareResults();
            renderCompareCards();
        }

        function renderCompareDimInfo(person) {
            const items = [];
            Array.from(selectedCompareDims).forEach(dim => {
                let value = '—';
                if (dim === '学历') value = person.education;
                if (dim === '政治面貌') value = person.political;
                items.push(`${dim}：${value}`);
            });
            return items.map(t => `<span class="dimension-chip">${t}</span>`).join('');
        }

        function renderTagCloud(tags) {
            const list = (tags || []).slice(0, 10);
            return `
                <div class="tag-cloud">
                    ${list.map((t, i) => `<span style="${getTagCloudStyle(i)}">${getCompareTagText(t)}</span>`).join('')}
                </div>
            `;
        }

        function updateSelectedTagChips() {
            const container = document.getElementById('selectedTagChips');
            container.innerHTML = '';
            selectedTags.forEach(tag => {
                const chip = document.createElement('span');
                chip.className = 'tag-chip';
                const label = document.createElement('span');
                label.textContent = getTagDisplayText(tag);
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'tag-chip-remove';
                remove.textContent = '×';
                remove.onclick = () => removeTag(tag);
                chip.appendChild(label);
                chip.appendChild(remove);
                container.appendChild(chip);
            });
        }

        function removeTag(tag) {
            selectedTags = selectedTags.filter(t => t !== tag);
            document.querySelectorAll('.tag-item').forEach(item => {
                if (item.dataset.tag === tag) {
                    item.classList.remove('selected');
                }
            });
            updateSelectedTagChips();
            if (viewMode === 'results') {
                selectedPersons.clear();
                currentPage = 1;
                renderPersonList();
            }
        }

        function openFilterDrawer() {
            document.getElementById('filterDrawer').classList.add('show');
        }

        function closeFilterDrawer() {
            document.getElementById('filterDrawer').classList.remove('show');
        }

        function closeFilterDrawerOnOverlay(event) {
            if (event.target && event.target.id === 'filterDrawer') {
                closeFilterDrawer();
            }
        }

        function confirmFilters() {
            closeFilterDrawer();
            updateSelectedTagChips();
            document.getElementById('aiSearchInput').focus();
        }

        // 清除筛选
        function clearFilters() {
            selectedTags = [];
            document.querySelectorAll('.tag-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('aiSearchInput').value = '';
            updateSelectedTagChips();
            if (viewMode === 'results') {
                selectedPersons.clear();
                currentPage = 1;
                renderPersonList();
            }
        }

        function addItem() {
            alert('添加功能需对接业务系统后启用。');
        }

        // 应用筛选
        function applyFilters() {
            aiSearch();
        }

        // AI搜索
        function aiSearch() {
            closeFilterDrawer();
            setViewMode('results');
            renderPersonList();
        }

        // 筛选人员数据
        function filterPersons() {
            const query = (document.getElementById('aiSearchInput')?.value || '').trim().toLowerCase();
            let data = personData;
            if (selectedTags.length > 0) {
                data = data.filter(person => selectedTags.some(tag => person.tags.includes(tag)));
            }
            if (query) {
                data = data.filter(person => {
                    const haystack = [
                        person.empNo,
                        person.name,
                        person.unit,
                        person.department,
                        person.office,
                        person.position,
                        person.gender,
                        String(person.age),
                        person.education,
                        person.marital,
                        person.empType,
                        person.political,
                        ...(person.tags || [])
                    ].join(' ').toLowerCase();
                    return haystack.includes(query);
                });
            }
            return data;
        }

        // 渲染人员列表
        function renderPersonList() {
            const filteredData = filterPersons();
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const pageData = filteredData.slice(startIndex, endIndex);
            
            const tbody = document.getElementById('personTableBody');
            tbody.innerHTML = '';
            
            pageData.forEach(person => {
                const row = document.createElement('tr');
                row.dataset.id = person.id;
                row.className = selectedPersons.has(person.id) ? 'selected' : '';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'person-checkbox';
                checkbox.checked = selectedPersons.has(person.id);
                checkbox.onclick = () => togglePersonSelect(person.id, row);
                
                row.innerHTML = `
                    <td>${checkbox.outerHTML}</td>
                    <td>${person.name}</td>
                    <td>${person.unit}</td>
                    <td>${person.department}</td>
                    <td>${person.office}</td>
                    <td>${person.position}</td>
                    <td>${person.gender}</td>
                    <td>${person.age}</td>
                    <td>${person.education}</td>
                    <td>${person.empType}</td>
                    <td>${person.political}</td>
                    <td><div class="tag-badge">${person.tags.map(t => `<span>${t}</span>`).join('')}</div></td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn resume" onclick="viewResume(${person.id})">📋 简历</button>
                            ${person.isCadre ? `<button class="action-btn profile" onclick="viewProfile(${person.id})">👤 画像</button>` : ''}
                            <button class="action-btn archive" onclick="viewArchive(${person.id})">📁 档案</button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
            
            // 更新分页
            document.getElementById('resultCount').textContent = `共 ${filteredData.length} 条记录`;
            document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
            document.getElementById('jumpPage').value = currentPage;
            document.getElementById('firstBtn').disabled = currentPage === 1;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            document.getElementById('lastBtn').disabled = currentPage >= totalPages;
            document.getElementById('selectAll').checked = selectedPersons.size === filteredData.length && filteredData.length > 0;
            
            updateSelectedCount();
        }

        // 切换人员选择
        function togglePersonSelect(id, row) {
            if (selectedPersons.has(id)) {
                selectedPersons.delete(id);
                row.classList.remove('selected');
            } else {
                selectedPersons.add(id);
                row.classList.add('selected');
            }
            updateSelectedCount();
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const filteredData = filterPersons();
            const isChecked = document.getElementById('selectAll').checked;
            
            if (isChecked) {
                filteredData.forEach(person => selectedPersons.add(person.id));
            } else {
                selectedPersons.clear();
            }
            
            document.querySelectorAll('.person-checkbox').forEach((checkbox, index) => {
                checkbox.checked = isChecked;
            });
            
            document.querySelectorAll('#personTableBody tr').forEach(row => {
                row.classList.toggle('selected', isChecked);
            });
            
            updateSelectedCount();
        }

        // 更新已选人数
        function updateSelectedCount() {
            const count = selectedPersons.size;
            document.getElementById('selectedCount').textContent = `已选 ${count} 人`;
            document.getElementById('compareBtn').disabled = count < 2;
        }

        // 首页
        function firstPage() {
            if (currentPage > 1) {
                currentPage = 1;
                renderPersonList();
            }
        }

        // 上一页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPersonList();
            }
        }

        // 下一页
        function nextPage() {
            const filteredData = filterPersons();
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderPersonList();
            }
        }

        // 末页
        function lastPage() {
            const filteredData = filterPersons();
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage = totalPages;
                renderPersonList();
            }
        }

        // 跳转到指定页
        function jumpToPage() {
            const jumpInput = document.getElementById('jumpPage');
            const targetPage = parseInt(jumpInput.value);
            const filteredData = filterPersons();
            const totalPages = Math.ceil(filteredData.length / pageSize);
            
            if (targetPage >= 1 && targetPage <= totalPages && targetPage !== currentPage) {
                currentPage = targetPage;
                renderPersonList();
            } else {
                jumpInput.value = currentPage;
            }
        }

        // 查看简历
        function viewResume(id) {
            const person = personData.find(p => p.id === id);
            if (person) {
                alert(`查看 ${person.name} 的简历\n\n工号：${person.empNo}\n岗位：${person.position}\n部门：${person.department}\n学历：${person.education}`);
            }
        }

        // 查看干部画像
        function viewProfile(id) {
            const person = personData.find(p => p.id === id);
            if (person) {
                window.open('干部画像.html', '_blank');
            }
        }

        // 查看干部档案
        function viewArchive(id) {
            const person = personData.find(p => p.id === id);
            if (person) {
                window.open('干部培养档案.html', '_blank');
            }
        }

        // 打开人才对比弹窗
        function openCompareModal() {
            const modal = document.getElementById('compareModal');
            initCompareDimPanel();
            showDimSelect();
            modal.classList.add('show');
        }

        function renderCompareCards() {
            const cardsContainer = document.getElementById('compareCards');
            cardsContainer.innerHTML = '';

            selectedPersons.forEach(id => {
                const person = personData.find(p => p.id === id);
                if (person) {
                    const card = document.createElement('div');
                    card.className = 'compare-card';
                    const avatarHtml = person.avatarUrl ? `<img src="${person.avatarUrl}" alt="${person.name}" />` : person.name.charAt(0);
                    card.innerHTML = `
                        <div class="compare-card-top">
                            <div class="card-left">
                                <div class="avatar-cloud">
                                    ${renderTagCloud(person.tags)}
                                    <div class="card-avatar">${avatarHtml}</div>
                                </div>
                                <div class="card-name">${person.name}</div>
                                <div class="card-position">${person.position}</div>
                            </div>
                            <div class="card-right">
                                <div class="card-basic">
                                    <div class="basic-item"><span class="basic-label">单位</span><span class="basic-value">${person.unit}</span></div>
                                    <div class="basic-item"><span class="basic-label">部门</span><span class="basic-value">${person.department}</span></div>
                                    <div class="basic-item"><span class="basic-label">性别</span><span class="basic-value">${person.gender}</span></div>
                                    <div class="basic-item"><span class="basic-label">年龄</span><span class="basic-value">${person.age}</span></div>
                                </div>
                            </div>
                        </div>
                        <div class="compare-card-bottom">
                            <div class="compare-dimensions">
                                ${renderCompareDimInfo(person)}
                            </div>
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                }
            });
        }

        // 关闭对比弹窗
        function closeCompareModal() {
            document.getElementById('compareModal').classList.remove('show');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initTagPanel();
            updateSelectedTagChips();
            setViewMode('landing');
            document.getElementById('aiSearchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    aiSearch();
                }
            });
        });
    </script>
</body>
</html>
