<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>干部培养档案管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .nav-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-left h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 4px;
        }

        .nav-tab {
            padding: 6px 16px;
            background: transparent;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .nav-tab.active {
            background: #fff;
            color: #1e3a5f;
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            font-size: 13px;
        }

        /* 主体内容区 */
        .main-container {
            display: flex;
            height: calc(100vh - 56px);
        }

        /* 左侧人员列表 */
        .left-panel {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 8px 36px 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .search-container input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .search-btn:hover {
            color: #2c5c97;
        }

        .org-tree-btn {
            padding: 8px 12px;
            background: #f5f7fa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            min-width: 100px;
            justify-content: center;
        }

        .org-tree-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            background: #fff;
            border: 2px solid #999;
            border-radius: 2px;
            position: relative;
        }

        .org-tree-btn::after {
            content: '';
            width: 6px;
            height: 0;
            border-top: 2px solid #999;
            position: absolute;
            margin-left: -10px;
            margin-top: 4px;
        }

        .org-tree-btn:hover {
            background: #e8eaed;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-tag {
            padding: 4px 10px;
            background: #e6f0ff;
            color: #2c5c97;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-tag:hover {
            background: #cce0ff;
        }

        .filter-tag .remove {
            font-size: 10px;
        }

        /* 人员列表 */
        .person-list {
            flex: 1;
            overflow-y: auto;
        }

        .person-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .person-item:hover {
            background: #fafafa;
        }

        .person-item.active {
            background: #e6f0ff;
            border-left: 3px solid #2c5c97;
        }

        .person-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            margin-right: 12px;
        }

        .person-info {
            flex: 1;
            min-width: 0;
        }

        .person-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }

        .person-dept {
            font-size: 12px;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .person-count {
            padding: 8px 16px;
            background: #fafafa;
            font-size: 12px;
            color: #999;
            text-align: right;
        }

        /* 组织架构搜索栏 */
        .org-search-bar {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .org-search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .org-search-bar input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .org-tree-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* 右侧档案目录 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .panel-toolbar {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2c5c97 0%, #1a3d6e 100%);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #666;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
        }

        .btn-success:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 上传弹窗 */
        .upload-modal {
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .upload-modal-body {
            flex: 1;
            overflow-y: auto;
            max-height: 60vh;
        }

        /* 档案目录树 */
        .archive-tree {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .tree-container {
            max-width: 100%;
        }

        .tree-node {
            margin-bottom: 4px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 12px;
        }

        .tree-item:hover {
            background: #f5f7fa;
        }

        .tree-item.active {
            background: #e6f0ff;
        }

        .tree-item.folder {
            font-weight: 500;
            color: #333;
        }

        .tree-item.file {
            color: #666;
            font-size: 13px;
            padding-left: 32px;
        }

        .file-checkbox {
            margin: 0 6px 0 0;
            width: 16px;
            height: 16px;
        }

        .tree-icon {
            margin-right: 8px;
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .tree-expand {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .tree-expand:hover {
            color: #2c5c97;
        }

        .tree-expand.expanded::before {
            content: '▼';
            color: #2c5c97;
        }

        .tree-expand.collapsed::before {
            content: '▶';
            color: #666;
        }

        .tree-indent {
            display: inline-block;
            width: 16px;
        }

        .tree-content {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .tree-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #999;
            min-width: 140px;
        }



        .tree-actions {
            display: flex;
            gap: 8px;
            width: 80px;
            justify-content: flex-end;
        }

        .action-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            color: #999;
            font-size: 16px;
        }

        .action-icon:hover {
            color: #2c5c97;
        }

        /* 档案目录头部 */
        .archive-tree-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #f5f7fa;
            border-bottom: 1px solid #e0e0e0;
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .archive-tree-header .header-name {
            flex: 1;
            padding-left: 20px;
        }

        .archive-tree-header .header-info {
            min-width: 140px;
        }



        .archive-tree-header .header-checkbox {
            width: 30px;
            text-align: center;
        }



        .archive-tree-header .header-actions {
            width: 80px;
            text-align: center;
        }

        /* 右键菜单 */
        .context-menu-item {
            padding: 8px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }

        .context-menu-item:hover {
            background: #f5f7fa;
        }

        /* 二级目录多输入框 */
        .subfolder-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .subfolder-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }

        .subfolder-input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .add-subfolder-btn {
            padding: 0 16px;
            background: #2c5c97;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
        }

        .add-subfolder-btn:hover {
            background: #1a3d6e;
        }

        /* hover提示 */
        .tooltip::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 8px;
            background: #333;
            color: #fff;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            margin-bottom: 8px;
            z-index: 100;
            max-width: 300px;
            word-wrap: break-word;
        }

        .tooltip:hover::before {
            opacity: 1;
            visibility: visible;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #333;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            margin-bottom: 3px;
            z-index: 100;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* 分页 */
        .pagination {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fafafa;
        }

        .pagination button {
            min-width: 32px;
            height: 32px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #2c5c97;
            color: #2c5c97;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f5f5;
        }

        .pagination .current-page {
            font-size: 20px;
            font-weight: 600;
            color: #2c5c97;
            min-width: 32px;
            text-align: center;
        }

        .pagination .page-jump {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            font-size: 12px;
        }

        .pagination .page-jump span {
            white-space: nowrap;
        }

        .pagination .page-jump input {
            width: 40px;
            height: 26px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 0 6px;
            font-size: 12px;
            text-align: center;
        }

        .pagination .page-jump input:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .pagination .page-jump .jump-btn {
            padding: 0 12px;
            height: 26px;
            background: #2c5c97;
            color: #fff;
            border-color: #2c5c97;
            font-size: 12px;
        }

        .pagination .page-jump .jump-btn:hover {
            opacity: 0.9;
        }

        /* 批量导出弹窗样式 */
        .batch-export-modal {
            width: 80%;
            max-width: 1000px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .batch-export-modal .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-container input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-container .search-btn {
            padding: 8px 24px;
        }

        .person-table-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .person-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .person-table th,
        .person-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .person-table th {
            background: #f5f7fa;
            font-weight: 600;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .person-table tbody tr:hover {
            background: #f5f7fa;
        }

        .person-table tbody tr.selected {
            background: #e8f0fe;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            font-size: 24px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 表单样式 */
        .form-item {
            margin-bottom: 16px;
        }

        .form-item label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .form-item input,
        .form-item select,
        .form-item textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-item input:focus,
        .form-item select:focus,
        .form-item textarea:focus {
            outline: none;
            border-color: #2c5c97;
        }

        .form-item textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #2c5c97;
            background: #f0f5ff;
        }

        .upload-area.dragover {
            border-color: #2c5c97;
            background: #e6f0ff;
        }

        .upload-icon {
            font-size: 36px;
            color: #999;
            margin-bottom: 12px;
        }

        .upload-text p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .upload-hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 多选框组 */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-item:hover {
            border-color: #2c5c97;
            background: rgba(44, 92, 151, 0.05);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }

        /* 组织机构树弹窗 */
        .org-tree-modal {
            max-width: 600px;
            max-height: 60vh;
        }

        .org-tree-content {
            max-height: 40vh;
            overflow-y: auto;
        }

        .org-tree-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .org-tree-item:hover {
            background: #f5f7fa;
        }

        .org-tree-item.selected {
            background: #e6f0ff;
            color: #2c5c97;
        }

        .org-tree-indent {
            display: inline-block;
            width: 16px;
        }

        /* 预览弹窗 */
        .preview-modal {
            max-width: 90vw;
            max-height: 90vh;
        }

        .preview-content {
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .preview-file-info {
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-file-name {
            font-weight: 600;
            color: #333;
        }

        .preview-file-size {
            font-size: 12px;
            color: #999;
        }

        /* 面板切换标签 */
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #2c5c97;
            border-bottom-color: #2c5c97;
            background: #fff;
        }

        .tab-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        /* 组织架构搜索容器 */
        .org-search-container {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 8px 36px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-icon {

        // 渲染左侧组织架构树
        function renderLeftOrgTree(data, level = 0, parentId = null) {
            const container = document.getElementById('orgTreeContainer');
            if (level === 0) {
                container.innerHTML = '';
            }
            
            data.forEach(item => {
                const node = document.createElement('div');
                node.className = `org-tree-node level-${level}`;
                node.dataset.id = item.id;
                node.dataset.parentId = parentId;
                
                let expandIcon = '';
                if (item.children && item.children.length > 0) {
                    expandIcon = '<span class="org-tree-expand" onclick="toggleOrgExpand(this, event)">▶</span>';
                } else {
                    expandIcon = '<span class="org-tree-expand">·</span>';
                }
                
                node.innerHTML = `${expandIcon}<span class="org-tree-icon">🏢</span>${item.name}`;
                node.onclick = () => selectOrgNode(item);
                container.appendChild(node);
                
                if (item.children) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'org-tree-children';
                    childrenContainer.dataset.parentId = item.id;
                    container.appendChild(childrenContainer);
                    renderLeftOrgTree(item.children, level + 1, item.id);
                }
            });
        }

        // 切换组织架构树展开/折叠
        function toggleOrgExpand(icon, event) {
            event.stopPropagation();
            const parentNode = icon.parentElement;
            const parentId = parentNode.dataset.id;
            const childrenContainer = document.querySelector(`.org-tree-children[data-parent-id="${parentId}"]`);
            
            if (childrenContainer) {
                if (childrenContainer.style.display === 'none') {
                    childrenContainer.style.display = 'block';
                    icon.textContent = '▼';
                } else {
                    childrenContainer.style.display = 'none';
                    icon.textContent = '▶';
                }
            }
        }

        function selectOrgNode(node) {
            // 移除之前的选中状态
            document.querySelectorAll('.org-tree-node').forEach(n => n.classList.remove('selected'));
            
            // 设置当前选中状态
            const selectedNode = document.querySelector(`.org-tree-node[data-id="${node.id}"]`);
            if (selectedNode) {
                selectedNode.classList.add('selected');
            }
            
            selectedOrgId = node.id;
            
            // 根据选中的组织架构筛选人员
            filterPersonsByOrg(node.id);

            document.getElementById('personListTab').disabled = false;
            showPersonList();

        function filterPersonsByOrg(orgId) {
            // 根据组织架构ID筛选人员（模拟逻辑）
            let orgName = getOrgNameById(orgId);
            
            filteredPersons = mockPersons.filter(person => {
                return person.dept.includes(orgName) || person.dept.startsWith(getOrgNameById(orgId));
            });
            
            allPersons = [...filteredPersons];

            updatePagination();

            document.getElementById('personCount').textContent = `共 ${filteredPersons.length} 条记录`;

        // 根据ID获取组织名称
        function getOrgNameById(orgId) {
            const findName = (data) => {
                for (let item of data) {
                    if (item.id === orgId) return item.name;
                    if (item.children) {
                        const found = findName(item.children);
                        if (found) return found;
                    }
                }
                return null;
            };
            return findName(mockOrgTree);
        }

        // 搜索组织架构树
        function searchOrgTree() {
            const keyword = document.getElementById('orgSearchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('orgClearBtn');
            
            // 显示/隐藏清空按钮
            clearBtn.style.display = keyword !== '' ? 'block' : 'none';
            
            const nodes = document.querySelectorAll('.org-tree-node');
            
            nodes.forEach(node => {
                const text = node.textContent.toLowerCase();
                if (keyword === '' || text.includes(keyword)) {
                    node.style.display = 'block';
                    // 显示父节点
                    let parent = node.parentElement;
                    while (parent) {
                        if (parent.classList.contains('org-tree-children')) {
                            parent.style.display = 'block';
                        }
                        parent = parent.parentElement;
                    }
                } else {
                    node.style.display = 'none';
                }
            });
            
            // 如果搜索结果为空，提示用户
            const visibleNodes = document.querySelectorAll('.org-tree-node:not([style*="display: none"])');
            if (visibleNodes.length === 0 && keyword !== '') {
                alert('未找到匹配的组织架构');
            }
        }

        // 展开/折叠文件夹
        function toggleFolder(element) {
            const expandIcon = element.querySelector('.tree-expand');
            const children = element.nextElementSibling;
            
            if (expandIcon && children) {
                if (expandIcon.classList.contains('expanded')) {
                    expandIcon.classList.remove('expanded');
                    expandIcon.classList.add('collapsed');
                    children.style.display = 'none';
                } else {
                    expandIcon.classList.remove('collapsed');
                    expandIcon.classList.add('expanded');
                    children.style.display = 'block';
                }
            }
        }

        // 渲染组织架构树
        function renderOrgTree(nodes, containerId, level = 0) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (level === 0) {
                container.innerHTML = '';
            }
            
            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'org-tree-item';
                div.dataset.id = node.id;
                div.innerHTML = `
                    <span style="margin-left: ${level * 16}px;">${node.children ? '📁' : '📋'}</span>
                    <span>${node.name}</span>
                `;
                
                div.onclick = () => {
                    document.querySelectorAll('.org-tree-item').forEach(item => item.classList.remove('selected'));
                    div.classList.add('selected');
                };

            { keywords: ['述职', '年度总结', '履职总结', '工作总结'], key: 'report', name: '历年述职报告' },
            { keywords: ['考察', '考核', '测评', '鉴定', '评议'], key: 'evaluation', name: '历次干部考察、考核材料' },
            { keywords: ['审计', '财务', '经济责任'], key: 'audit', name: '历次审计报告' },

        // 根据文件名智能分类
        function autoCategorize(fileName) {
            const lowerName = fileName.toLowerCase();
            for (const rule of categoryRules) {
                for (const keyword of rule.keywords) {
                    if (lowerName.includes(keyword.toLowerCase())) {
                        return rule;
                    }
                }
            }
            // 默认分类到其他材料
            return { key: 'other', name: '其他材料' };
        }

        // 文件选择处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                for (const file of files) {
                    const category = autoCategorize(file.name);
                    pendingFiles.push({
                        name: file.name,
                        size: file.size,
                        category: category.key,
                        categoryName: category.name,
                        isAuto: true
                    });
                }
                renderFileCategoryList();
                document.getElementById('uploadFileList').style.display = 'block';
            }
        });

        // 渲染文件分类列表（按目录分组）
        function renderFileCategoryList() {
            const container = document.getElementById('fileCategoryList');
            if (pendingFiles.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">暂无待分类文件</p>';
                return;
            }
            
            // 按分类分组
            const groupedFiles = {};
            pendingFiles.forEach((file, index) => {
                if (!groupedFiles[file.category]) {
                    groupedFiles[file.category] = [];
                }
                groupedFiles[file.category].push({ ...file, index });
            });
            
            let html = '';
            Object.keys(groupedFiles).forEach(categoryKey => {
                const categoryName = getCategoryNameByKey(categoryKey);
                const files = groupedFiles[categoryKey];
                
                const categoryOptions = categoryRules.map(rule => 
                    `<option value="${rule.key}" ${categoryKey === rule.key ? 'selected' : ''}>${rule.name}</option>`
                ).join('') + `<option value="other" ${categoryKey === 'other' ? 'selected' : ''}>其他材料</option>`;
                
                html += `
                    <div style="border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 8px; overflow: hidden;">
                        <div style="display: flex; align-items: center; padding: 10px 12px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0;">
                            <select class="category-select" onchange="changeCategoryGroup('${categoryKey}', this.value)" style="flex: 1; padding: 4px 8px; font-size: 13px; border-radius: 4px; border: 1px solid #e0e0e0;">
                                ${categoryOptions}
                            </select>
                            <span style="margin-left: 8px; font-size: 12px; color: #666;">${files.length} 个文件</span>
                            <span style="margin-left: 8px; font-size: 11px; color: #10b981;">✓</span>
                        </div>
                        <div style="padding: 8px 12px;">
                `;
                
                files.forEach(item => {
                    html += `
                        <div style="display: flex; align-items: center; padding: 6px 0; border-bottom: 1px dashed #eee; ${item.index % 2 === 0 ? '' : ''}">
                            <span style="flex: 1; font-size: 13px; color: #333;">📄 ${item.name}</span>
                            <span style="margin-left: 8px; font-size: 12px; color: #999;">${(item.size / 1024).toFixed(1)}KB</span>
                            <button onclick="removePendingFile(${item.index})" style="margin-left: 12px; background: none; border: none; color: #999; cursor: pointer; font-size: 16px;">×</button>
                        </div>
                    `;
                });
                
                html += '</div></div>';
            });
            
            container.innerHTML = html;
        }

        // 更改整个分类组的目录
        function changeCategoryGroup(oldCategory, newCategory) {
            if (oldCategory === newCategory) return;
            
            pendingFiles.forEach(file => {
                if (file.category === oldCategory) {
                    const rule = categoryRules.find(r => r.key === newCategory);
                    file.category = newCategory;
                    file.categoryName = rule ? rule.name : '其他材料';
                    file.isAuto = false;
                }
            });
            renderFileCategoryList();
        }



        // 重置为自动分类
        function resetCategories() {
            pendingFiles.forEach(file => {
                const category = autoCategorize(file.name);
                file.category = category.key;
                file.categoryName = category.name;
                file.isAuto = true;
            });
            renderFileCategoryList();
        }

        // 移除待上传文件
        function removePendingFile(index) {
            pendingFiles.splice(index, 1);

                document.getElementById('uploadFileList').style.display = 'none';
            }
            renderFileCategoryList();
        }

        // 获取分类key对应的显示名称
        function getCategoryNameByKey(key) {
            const rule = categoryRules.find(r => r.key === key);
            return rule ? rule.name : '其他材料';
        }

            // 将文件分配到对应目录
            pendingFiles.forEach(file => {
                const categoryName = getCategoryNameByKey(file.category);

                    mockArchiveTree[categoryName] = [];

                const sizeInKB = (file.size / 1024).toFixed(1);
                mockArchiveTree[categoryName].push({
                    name: file.name,
                    size: `${sizeInKB}KB`,
                    date: new Date().toLocaleDateString('zh-CN'),
                    remark: ''
                });
            });

            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('pageJumpInput').value = currentPage;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePagination();
                renderPersonListPage(currentPage);
            }
        }

        function nextPage() {
            const totalPages = getTotalPages();
            if (currentPage < totalPages) {
                currentPage++;
                updatePagination();
                renderPersonListPage(currentPage);
            }
        }

        function jumpToPage() {
            const totalPages = getTotalPages();
            const targetPage = parseInt(document.getElementById('pageJumpInput').value);
            if (targetPage >= 1 && targetPage <= totalPages) {
                currentPage = targetPage;
                updatePagination();
                renderPersonListPage(currentPage);
            } else {
                alert(`请输入有效页码（1-${totalPages}）`);
                document.getElementById('pageJumpInput').value = currentPage;
            }
        }

        function renderPersonListPage(page) {
            const persons = filteredPersons.length > 0 ? filteredPersons : (allPersons.length > 0 ? allPersons : mockPersons);
            const start = (page - 1) * pageSize;
            const end = start + pageSize;
            const pagePersons = persons.slice(start, end);
            
            const container = document.getElementById('personList');
            container.innerHTML = pagePersons.map(person => `
                <div class="person-item" data-id="${person.id}" onclick="selectPerson('${person.id}')">
                    <div class="person-avatar">${person.name.charAt(0)}</div>
                    <div class="person-info">
                        <div class="person-name">${person.name}</div>
                        <div class="person-dept">${person.dept}</div>
                    </div>
                </div>
            `).join('');
            
            if (currentPerson) {
                const selectedItem = document.querySelector(`.person-item[data-id="${currentPerson.id}"]`);
                if (selectedItem) {
                    selectedItem.classList.add('active');
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initPage();
            updatePagination();
        });
    </script>
</body>
</html>
